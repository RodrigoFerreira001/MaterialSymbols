name: Deploy Pages (Showcase)

on:
  push:
    branches:
      - main
    paths:
      - 'material-symbols/**'
      - 'material-symbols-sample/**'
      - 'build-logic/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build sample webApp wasmJs distribution
        run: ./gradlew :material-symbols-sample:webApp:wasmJsBrowserDistribution

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r material-symbols-sample/webApp/build/dist/wasmJs/productionExecutable/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
